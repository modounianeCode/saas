<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne — Argent Clair</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f8fc;
        color: #17213a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        background: #fff;
        max-width: 420px;
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 24px 70px #26295d1c;
        text-align: center;
      }
      .brand { font-weight: 700; color: #7657e8; letter-spacing: -0.4px; }
      h1 { font-size: 24px; margin: 20px 0 10px; }
      p { color: #5e6a86; margin: 0 0 24px; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 11px;
        background: #7657e8;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 14px 18px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">✦ Argent Clair</div>
      <h1>Vous êtes hors ligne</h1>
      <p>
        Cette page n’a pas encore été mise en cache sur cet appareil. Vos
        modifications enregistrées hors ligne seront synchronisées dès le
        retour du réseau.
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
